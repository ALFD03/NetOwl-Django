<!DOCTYPE html>
<!-- [base.html] Plantilla base del proyecto Churn Rate Analyzer. Define el layout global,
     carga CSS/JS comunes y provee bloques (title, content, extra_head, extra_js)
     para que las plantillas hijas extiendan y personalicen. -->
<html lang="es">
<head>
  <!-- Meta: codificación y viewport responsive -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bloque title: permite a cada página definir su propio título. Valor por defecto: "Churn Rate Analyzer". Contexto esperado: ninguno (opcional si se redefine). -->
  <title>{% block title %}Churn Rate Analyzer{% endblock %}</title>
  <!-- CSS: Bootstrap 5.3.3 (CDN), Flatpickr para selector de fechas, y hoja de estilos local -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <!-- Bloque extra_head: espacio para inyectar librerías CSS/JS adicionales desde plantillas hijas -->
  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Navbar: incluido desde includes/navbar.html (barra de navegación principal) -->
  {% include 'includes/navbar.html' %}

  <!-- Contenedor principal del contenido. Renderiza mensajes flash (contexto: messages) y el bloque content -->
  <main class="container-fluid py-4 px-4">
    <!-- Mensajes flash: Itera sobre la lista messages (contexto Django). Cada mensaje usa su tag como clase de alerta Bootstrap. -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    <!-- Bloque content: las plantillas hijas insertan aquí su contenido principal -->
    {% block content %}{% endblock %}
  </main>

  <!-- Overlay de carga: se muestra al enviar formularios con atributo data-loading. Clase d-none lo oculta inicialmente. -->
  <div id="loading-overlay" class="loading-overlay d-none">
    <div class="loading-box">
      <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mb-0 fw-semibold text-muted" id="loading-text">Procesando datos...</p>
    </div>
  </div>

  <!-- Scripts globales: Bootstrap JS, Flatpickr con localización en español, y JS local -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
  <!-- Bloque extra_js: para inyectar scripts adicionales desde plantillas hijas (ej. gráficos) -->
  {% block extra_js %}{% endblock %}
</body>
</html>
