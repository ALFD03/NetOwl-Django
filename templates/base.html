<!DOCTYPE html>
<!-- [base.html] Plantilla base del proyecto NetOwl-Django. Define el layout global con sidebar fijo,
     carga CSS/JS comunes y provee bloques (title, content, extra_head, extra_js)
     para que las plantillas hijas extiendan y personalicen. -->
<html lang="es">
<head>
  <!-- Meta: codificación y viewport responsive -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <!-- Bloque title: permite a cada página definir su propio título. -->
  <title>{% block title %}NetOwl Analytics{% endblock %}</title>
  <!-- CSS: Bootstrap 5.3.3 (CDN), Bootstrap Icons, y hoja de estilos local -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link id="favicon-link" rel="icon" href="{% static 'img/favicon_light.png' %}">
  <!-- Bloque extra_head -->
  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Contenedor principal con layout de sidebar -->
  <div class="d-flex min-vh-100">
    <!-- Sidebar Fijo -->
    <nav class="sidebar flex-shrink-0">
      <div class="sidebar-brand d-flex align-items-center p-3">
        <!-- Logo de NetOwl -->
          <a href="/" class="navbar-brand text-decoration-none fw-bold" data-link="dashboard">
          <img src="{% static 'img/logo.png' %}" alt="NetOwl Logo" width="100%" class="img-fluid" id="sidebar-logo">
        </a>
      </div>
      <div class="sidebar-nav p-3">
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center py-2 rounded-3" href="/" data-link="dashboard">
              <i class="bi bi-speedometer2 me-2"></i>
              <span>Dashboard</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center py-2 rounded-3" href="/analytics/" data-link="analytics">
              <i class="bi bi-bar-chart me-2"></i>
              <span>Analytics</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center py-2 rounded-3" href="/import/subscriptions/" data-link="import_subscriptions">
              <i class="bi bi-cloud-arrow-down me-2"></i>
              <span>Importar</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center py-2 rounded-3" href="/results/" data-link="results_list">
              <i class="bi bi-table me-2"></i>
              <span>Resultados</span>
            </a>
          </li>
        </ul>
      </div>
      <div class="sidebar-footer mt-auto p-3">
        <!-- Botón de tema claro/oscuro -->
        <button id="theme-toggle" class="btn btn-outline-light w-100 rounded-3">
          <i class="bi bi-moon-stars me-2"></i>
          <span>Modo Claro</span>
        </button>
      </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="main-content flex-grow-1">
      <!-- Contenedor del contenido -->
      <div class="container-fluid px-4 py-3">
        <!-- Bloque content: las plantillas hijas insertan aquí su contenido principal -->
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

  <!-- Contenedor para notificaciones flotantes (Toasts) -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
    <div id="status-toast" class="toast align-items-center border-0 text-white bg-dark" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toast-message">
          Mensaje de notificación.
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    </div>
  </div>

  <!-- Overlay de carga: se muestra al enviar formularios con atributo data-loading -->
  <div id="loading-overlay" class="loading-overlay d-none">
    <div class="loading-box">
      <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mb-0 fw-semibold text-muted" id="loading-text">Procesando datos...</p>
    </div>
  </div>

  <!-- Scripts globales: Bootstrap JS y JS local -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
  <script>
    // Inicializar favicon según tema guardado
    (function(){
      try {
        const savedTheme = localStorage.getItem('netowl-theme');
        const fav = document.getElementById('favicon-link');
        if (fav) {
          fav.href = savedTheme === 'light' ? '/static/img/favicon_light.png' : '/static/img/favicon_dark.png';
        }
      } catch(e) { /* noop */ }
    })();
  </script>
  <!-- Bloque extra_js -->
  {% block extra_js %}{% endblock %}
</body>
</html>
