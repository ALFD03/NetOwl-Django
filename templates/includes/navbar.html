<!-- [navbar.html] Barra de navegación principal incluida desde base.html.
     Sin contexto Django adicional; usa únicamente etiquetas url. -->
{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-info mb-4 shadow">
  <div class="container-fluid gap-3">
    <!-- Marca / logo del sitio, enlaza al dashboard -->
    
    <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">
      <img src="{% static 'img/logo.png' %}" alt="Logo" width="180" class="img-fluid">
    </a>
    <!-- Botón de colapso para pantallas pequeñas (hamburguesa) -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <!-- Menú de navegación colapsable -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <!-- Enlace al dashboard -->
        <!-- <li class="nav-item">
          <a class="nav-link text-white" href="{% url 'dashboard' %}">Dashboard</a>
        </li> -->
        <!-- Dropdown "Importar" con opciones para subir CSV de subscripciones y logs -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown">
            Importar
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="{% url 'import_subscriptions' %}">Subscripciones</a></li>
            <li><a class="dropdown-item" href="{% url 'import_logs' %}">Logs</a></li>
          </ul>
        </li>
        <!-- Enlace a la lista de resultados históricos -->
        <li class="nav-item">
          <a class="nav-link text-white" href="{% url 'results_list' %}">Resultados</a>
        </li>
      </ul>
    </div>
    <button class="btn btn-outline-light rounded-circle">
      <i class="bi bi-brightness-high-fill"></i>
    </button>
  </div>
</nav>
