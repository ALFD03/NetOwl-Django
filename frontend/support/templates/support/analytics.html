{% extends 'support/base.html' %}
{% load static %}

{% block title %}NetOwl - Technical Support Analytics{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/subscriptions.css' %}">
  <style>
    .site-card { margin-bottom: 1.5rem; border-left: 4px solid var(--primary); }
    .table-sales th, .table-sales td { padding: 0.5rem 0.75rem; font-size: 0.85rem; }
    .table-sales thead th { background-color: var(--surface-tertiary) !important; font-weight: 600; }
  </style>
{% endblock %}

{% block content %}
<!-- Cabecera únicamente con Filtro de Periodo -->
<div class="card-header rounded d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2 py-2" style="background: var(--surface-secondary); border: 1px solid var(--border-color);">
  <h4 class="mb-0 px-2"><i class="bi bi-diagram-3 text-primary me-2"></i>Análisis por Equipo de Trabajo</h4>
  
  <div class="d-flex align-items-center gap-2">
    <label class="form-label mb-0 text-muted small fw-bold">Periodo:</label>
    <select id="filterPeriodoAnalytics" class="form-select form-select-sm prominent-filter" style="width:auto"></select>
  </div>
</div>

<!-- Contenedor Dinámico para cada Grupo de Trabajo -->
<div id="analyticsGroupsContainer">
  <div class="text-center py-5 text-muted">
    <div class="spinner-border spinner-border-sm text-primary me-2"></div>Cargando analíticas por grupo...
  </div>
</div>
{% endblock %}

{% block extra_js %}
  <script src="{% static 'support/js/analytics.js' %}"></script>
{% endblock %}
