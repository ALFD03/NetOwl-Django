<!-- --- START OF FILE NetOwl-Django/frontend/crm/templates/crm/partials/header.html --- -->
<div class="module-header">
  <div class="module-header-top">
    <div class="module-header-title">
      <i class="bi bi-people"></i>
      <span>CRM Analytics</span>
    </div>
  </div>
  <nav class="module-nav">
    <!-- Dashboard -->
    <a href="/crm/dashboard/" class="module-nav-link {% if section == 'dashboard' %}active{% endif %}">
      <i class="bi bi-speedometer2"></i>Dashboard
    </a>
    
    <!-- Analytics -->
    {% if request.user.profile.can_view_crm_analytics or request.user.is_superuser %}
      <a href="/crm/analytics/" class="module-nav-link {% if section == 'analytics' %}active{% endif %}">
        <i class="bi bi-bar-chart"></i>Analytics
      </a>
    {% endif %}

    <!-- Results -->
    {% if request.user.profile.can_view_crm_results or request.user.is_superuser %}
      <a href="/crm/results/" class="module-nav-link {% if section == 'results' %}active{% endif %}">
        <i class="bi bi-table"></i>Results
      </a>
    {% endif %}
  </nav>
</div>
<!-- --- END OF FILE NetOwl-Django/frontend/crm/templates/crm/partials/header.html --- -->
