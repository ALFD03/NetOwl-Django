<div class="module-header">
  <div class="module-header-top">
    <div class="module-header-title">
      <i class="bi bi-people"></i>
      <span>CRM Analytics</span>
    </div>
  </div>
  <nav class="module-nav">
    <a href="/crm/dashboard/" class="module-nav-link {% if section == 'dashboard' %}active{% endif %}">
      <i class="bi bi-speedometer2"></i>Dashboard
    </a>
    <a href="/crm/analytics/" class="module-nav-link {% if section == 'analytics' %}active{% endif %}">
      <i class="bi bi-bar-chart"></i>Analytics
    </a>
    {% if not user.profile.role == 'viewer' %}
    <a href="/crm/import/" class="module-nav-link {% if section == 'imports' %}active{% endif %}">
      <i class="bi bi-cloud-arrow-down"></i>Imports
    </a>
    {% endif %}
    <a href="/crm/results/" class="module-nav-link {% if section == 'results' %}active{% endif %}">
      <i class="bi bi-table"></i>Results
    </a>
  </nav>
</div>
