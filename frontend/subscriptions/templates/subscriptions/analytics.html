{% extends 'subscriptions/base.html' %}
{% load static %}

{% block title %}NetOwl - Analytics{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/subscriptions.css' %}">
{% endblock %}

{% block content %}
<div class="card-header rounded d-flex justify-content-end mb-3 align-items-center">
  <h4 class="mb-0 me-auto"><i class="bi bi-bar-chart-line me-2"></i>Analisis Detallado</h4>
  <div class="dropdown" id="analytics-filter-dropdown">
    <button class="btn dropdown-toggle prominent-filter d-flex align-items-center gap-2" type="button" id="analytics-filter-toggle">
      <i class="bi bi-funnel-fill"></i><span id="analytics-filter-label">Seleccionar periodos...</span>
    </button>
    <div class="dropdown-menu p-3 analytics-filter-menu" id="analytics-filter-menu" style="min-width:320px;max-height:300px;overflow-y:auto">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-muted small">Periodos</span>
      </div>
      <div id="analytics-periods-checkboxes"></div>
      <hr class="my-2">
      <button class="btn btn-outline-light btn-sm w-100" id="analytics-reset-btn" type="button"><i class="bi bi-arrow-counterclockwise me-1"></i>Restablecer (mes actual)</button>
    </div>
  </div>
</div>

<div class="row g-3 mb-4" id="analytics-cards-container"></div>
<div id="analytics-dimension-charts"></div>
{% endblock %}

{% block extra_js %}
  <script src="{% static 'subscriptions/js/analytics.js' %}"></script>
{% endblock %}
