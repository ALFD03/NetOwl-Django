<div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content" style="background-color:var(--surface-secondary);color:var(--text-primary);border:1px solid var(--border-color)">
      <div class="modal-header" style="border-bottom:1px solid var(--border-color)">
        <h5 class="modal-title">Detalle: <span id="modal-period-title" class="text-primary fw-bold"></span></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <h6 class="mb-3 text-uppercase small text-muted"><i class="bi bi-sliders me-2"></i>Resumen</h6>
        <div class="row g-3 mb-4" id="modal-summary-container"></div>
        <hr style="border-top:1px solid var(--border-color)" class="my-4">
        <h6 class="mb-3 text-uppercase small text-muted"><i class="bi bi-bar-chart me-2"></i>Desglose Dimensiones</h6>
        <div class="row g-3" id="modal-dimensions-container"></div>
      </div>
      <div class="modal-footer" style="border-top:1px solid var(--border-color)">
        <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
