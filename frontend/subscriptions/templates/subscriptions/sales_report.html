{% extends 'subscriptions/base.html' %}
{% load static %}

{% block title %}NetOwl - Sales Report{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/subscriptions.css' %}">
  <style>
    .site-card { margin-bottom: 2rem; border-left: 4px solid var(--primary); }
    .table-sales th, .table-sales td { padding: 0.6rem 0.8rem; font-size: 0.9rem; }
    .table-sales thead th { background-color: var(--surface-tertiary) !important; font-weight: 600; }
    .subtotal-row { background-color: rgba(255, 255, 255, 0.03) !important; font-weight: bold; }
    .subtotal-row td { border-top: 2px solid var(--border-color); border-bottom: 2px solid var(--border-color); }
  </style>
{% endblock %}

{% block content %}
<div class="card-header rounded d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
  <h4 class="mb-0"><i class="bi bi-file-earmark-bar-graph me-2"></i>Reporte Regional de Ventas</h4>
  <div class="d-flex align-items-center gap-2">
    <label class="form-label mb-0 text-muted small fw-bold">Periodo:</label>
    <select id="salesPeriodSelect" class="form-select form-select-sm prominent-filter" style="width:auto"></select>
  </div>
</div>

<div id="salesReportContainer">
  <div class="text-center py-5 text-muted">
    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>Cargando reporte de ventas...
  </div>
</div>
{% endblock %}

{% block extra_js %}
  <script src="{% static 'subscriptions/js/sales_report.js' %}"></script>
{% endblock %}
