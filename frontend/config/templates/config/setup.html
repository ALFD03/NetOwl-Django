{% extends 'base.html' %}
{% block title %}NetOwl - Instalación Inicial{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
  <div class="card shadow-lg" style="width: 100%; max-width: 460px; background-color: var(--surface-secondary);">
    <div class="card-header text-center py-4" style="border-bottom: 1px solid var(--border-color);">
      <h4 class="mb-0 fw-bold text-success"><i class="bi bi-rocket-takeoff-fill me-2"></i>Instalación de NetOwl</h4>
      <p class="text-muted small mb-0 mt-1">Crea la primera cuenta con rol de Administrador</p>
    </div>
    <div class="card-body p-4">
      {% if error_message %}
        <div class="alert alert-danger py-2 px-3 small mb-4">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error_message }}
        </div>
      {% endif %}
      
      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-bold">Nombre del Administrador</label>
          <input type="text" name="username" class="form-control" placeholder="admin" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Contraseña del Administrador</label>
          <input type="password" name="password" class="form-control" placeholder="Mínimo 8 caracteres" required>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-bold">Confirmar Contraseña</label>
          <input type="password" name="password_confirm" class="form-control" placeholder="Escribe de nuevo la contraseña" required>
        </div>
        <button type="submit" class="btn btn-success w-100 py-2 fw-bold"><i class="bi bi-check-circle me-2"></i>Crear Cuenta y Finalizar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
