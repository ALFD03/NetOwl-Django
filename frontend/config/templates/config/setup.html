<!DOCTYPE html>
<html lang="es" class="light-mode">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetOwl - Configuración Inicial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link id="favicon-link" rel="icon" href="{% static 'img/favicon_light.png' %}">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--surface-primary);
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--surface-secondary);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      box-shadow: var(--shadow-lg);
      padding: 2.5rem 2rem;
    }
    .auth-logo {
      max-height: 48px;
      margin-bottom: 0.5rem;
    }
    .auth-title {
      font-weight: 700;
      color: var(--text-primary);
    }
    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    .theme-toggle-auth {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 1050;
      background: var(--surface-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 2rem;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background var(--transition-speed);
    }
    .theme-toggle-auth:hover {
      background: var(--surface-hover);
    }
  </style>
</head>
<body>
  <button class="theme-toggle-auth" id="theme-toggle" type="button">
    <i class="bi bi-sun-fill"></i>
    <span>Modo Claro</span>
  </button>

  <div class="auth-page">
    <div class="auth-card">
      <div class="text-center mb-4">
        <img id="auth-logo" src="{% static 'img/logo_light.png' %}" alt="NetOwl" class="auth-logo">
        <h4 class="auth-title mt-2">Configuración Inicial</h4>
        <p class="auth-subtitle">Crea el primer usuario administrador</p>
      </div>
      <form method="post">
        {% csrf_token %}
        {% if messages %}
          {% for msg in messages %}
            <div class="alert alert-{{ msg.tags }} py-2 small">{{ msg }}</div>
          {% endfor %}
        {% endif %}
        <div class="mb-3">
          <label class="form-label small fw-medium">Nombre de Usuario</label>
          <input type="text" name="username" class="form-control" placeholder="admin" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-medium">Correo Electrónico</label>
          <input type="email" name="email" class="form-control" placeholder="admin@ejemplo.com">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-medium">Contraseña</label>
          <input type="password" name="password" class="form-control" placeholder="Mínimo 8 caracteres" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-medium">Confirmar Contraseña</label>
          <input type="password" name="password2" class="form-control" placeholder="Repite la contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Crear Administrador</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/theme.js' %}"></script>
</body>
</html>
