{% extends 'config/base.html' %}
{% load static %}

{% block title %}NetOwl - Eliminar Usuario{% endblock %}

{% block content %}
<div class="mb-4">
  <h4 class="mb-0 text-danger"><i class="bi bi-exclamation-triangle me-2"></i>Eliminar Usuario</h4>
</div>

<div class="card border-danger" style="max-width:480px">
  <div class="card-body text-center py-5">
    <i class="bi bi-person-x-fill text-danger" style="font-size:3rem"></i>
    <h5 class="mt-3">¿Estás seguro de eliminar a <strong>{{ delete_user.username }}</strong>?</h5>
    <p class="text-muted small">Esta acción no se puede deshacer.</p>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex justify-content-center gap-2 mt-4">
        <a href="{% url 'config:user_list' %}" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-danger">Eliminar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
