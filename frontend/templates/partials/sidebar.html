{% load static %}
<nav class="sidebar flex-shrink-0">
  <div class="sidebar-brand d-flex align-items-center p-3">
    <a href="/" class="navbar-brand text-decoration-none fw-bold">
      <img src="{% static 'img/logo.png' %}" alt="NetOwl Logo" width="100%" class="img-fluid" id="sidebar-logo">
    </a>
  </div>
  <div class="sidebar-nav p-3" id="sidebar-nav">
    <ul class="nav flex-column" id="module-list">
      <li class="nav-item">
        <a class="nav-link d-flex align-items-center py-2 rounded-3 module-link" href="/subscriptions/dashboard/" data-module="subscriptions">
          <i class="bi bi-layers me-2"></i>
          <span>Subscriptions</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link d-flex align-items-center py-2 rounded-3 module-link" href="/crm/dashboard/" data-module="crm">
          <i class="bi bi-people me-2"></i>
          <span>CRM</span>
        </a>
      </li>
    </ul>
  </div>
  <div class="sidebar-footer mt-auto p-3">
    {% if user.is_authenticated %}
      <div class="user-info mb-2 text-white-50 small">
        <i class="bi bi-person-circle me-1"></i> {{ user.get_full_name|default:user.username }}
        {% if user.is_staff %}
          <a href="{% url 'config:user_list' %}" class="d-block text-white-50 small mt-1">
            <i class="bi bi-gear me-1"></i>Configuración
          </a>
        {% endif %}
      </div>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-light w-100 rounded-3 btn-sm">
          <i class="bi bi-box-arrow-right me-2"></i><span>Cerrar sesión</span>
        </button>
      </form>
    {% endif %}
    <button id="theme-toggle" class="btn btn-outline-light w-100 rounded-3 mt-2">
      <i class="bi bi-moon-stars me-2"></i>
      <span>Modo Claro</span>
    </button>
  </div>
</nav>
